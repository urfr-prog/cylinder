<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino Cube — Sliding Icons</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0c0d14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: rgba(126, 200, 227, 0.35);
            font-weight: 200;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .scene {
            width: 300px;
            height: 300px;
            perspective: 700px;
            position: relative;
            touch-action: none;
        }

        .cube {
            width: 120px;
            height: 120px;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -60px;
            margin-top: -60px;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .face {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 16px;
            overflow: hidden;
            backface-visibility: hidden;
            background: #0e0f18;
            border: 1px solid rgba(126, 200, 227, 0.5);
            box-shadow:
                0 0 25px rgba(126, 200, 227, 0.08),
                inset 0 0 30px rgba(126, 200, 227, 0.04);
        }

        .face-front  { transform: rotateY(0deg)    translateZ(60px); }
        .face-right  { transform: rotateY(90deg)   translateZ(60px); }
        .face-back   { transform: rotateY(180deg)  translateZ(60px); }
        .face-left   { transform: rotateY(-90deg)  translateZ(60px); }

        /* Separator */
        .face .sep {
            position: absolute;
            left: 50%;
            top: 8%;
            bottom: 8%;
            width: 1px;
            background: rgba(126, 200, 227, 0.3);
        }

        /* Icon positioned inside the face */
        .face .icon {
            position: absolute;
            top: 50%;
            width: 36px;
            height: 36px;
            margin-top: -18px;
            transition: left 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.35s ease;
            filter: drop-shadow(0 0 6px rgba(126, 200, 227, 0.5));
        }

        .face .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .face .icon svg .stroke-icon {
            stroke: #7ec8e3;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .face .icon svg .fill-icon {
            fill: #7ec8e3;
            stroke: none;
        }

        /* Positions: centered in left quarter or right quarter */
        .face .icon.pos-left  { left: calc(25% - 18px); }
        .face .icon.pos-right { left: calc(75% - 18px); }

        /* Slide out toward edge */
        .face .icon.slide-to-right { left: calc(100% - 12px); opacity: 0; }
        .face .icon.slide-to-left  { left: -24px; opacity: 0; }

        /* Arrive from edge */
        .face .icon.from-right { left: calc(100% - 12px); opacity: 0; transition: none; }
        .face .icon.from-left  { left: -24px; opacity: 0; transition: none; }

        @keyframes spinFlash {
            0%   { box-shadow: 0 0 30px rgba(126,200,227,0.15); }
            50%  { box-shadow: 0 0 50px rgba(126,200,227,0.4); }
            100% { box-shadow: 0 0 30px rgba(126,200,227,0.15); }
        }
        .glow.flash { animation: spinFlash 0.6s ease; }

        .glow {
            width: 90px; height: 10px; border-radius: 50%;
            background: rgba(126,200,227,0.15);
            box-shadow: 0 0 30px rgba(126,200,227,0.15);
            margin-top: 24px;
        }

        .face-label {
            color: rgba(126,200,227,0.25);
            font-size: 0.7rem; letter-spacing: 0.2em; margin-top: 16px;
        }

        .face-dots { display: flex; gap: 8px; margin-top: 12px; }
        .face-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(126,200,227,0.15); transition: all 0.4s;
        }
        .face-dot.active {
            background: rgba(126,200,227,0.6);
            box-shadow: 0 0 8px rgba(126,200,227,0.4);
        }

        .nav-arrows { display: flex; gap: 40px; margin-top: 14px; align-items: center; }
        .nav-arrow {
            width: 40px; height: 40px;
            border: 1px solid rgba(126,200,227,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            background: transparent; color: rgba(126,200,227,0.4); font-size: 1rem;
        }
        .nav-arrow:hover { border-color: rgba(126,200,227,0.5); color: rgba(126,200,227,0.8); }
        .nav-arrow:active { transform: scale(0.9); }

        .hint { color: rgba(180,180,190,0.2); font-size: 0.6rem; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>Domino Cube</h1>
    <div class="scene" id="scene">
        <div class="cube" id="cube"></div>
    </div>
    <div class="glow" id="glow"></div>
    <div class="face-dots">
        <div class="face-dot active"></div>
        <div class="face-dot"></div>
        <div class="face-dot"></div>
        <div class="face-dot"></div>
    </div>
    <div class="nav-arrows">
        <div class="nav-arrow" id="btnLeft">◀</div>
        <div class="face-label" id="faceLabel">A · B</div>
        <div class="nav-arrow" id="btnRight">▶</div>
    </div>
    <div class="hint">← → / swipe = naviguer</div>

    <script>
        // ═══════════════════════════════════════
        //  4 icons
        // ═══════════════════════════════════════

        const ICONS_SVG = [
            // A — Mountain
            `<svg viewBox="0 0 40 40"><path class="stroke-icon" d="M 6 32 L 20 8 L 34 32"/><path class="stroke-icon" d="M 13 32 L 20 18 L 27 32"/></svg>`,
            // B — Circle
            `<svg viewBox="0 0 40 40"><circle class="stroke-icon" cx="20" cy="20" r="12"/><circle class="fill-icon" cx="20" cy="20" r="3"/></svg>`,
            // C — Diamond
            `<svg viewBox="0 0 40 40"><path class="stroke-icon" d="M 20 4 L 36 20 L 20 36 L 4 20 Z"/></svg>`,
            // D — Wave
            `<svg viewBox="0 0 40 40"><path class="stroke-icon" d="M 4 20 Q 12 4 20 20 Q 28 36 36 20"/></svg>`,
        ];

        // Face layout: [leftIconIdx, rightIconIdx]
        const FACE_ICONS = [
            [0, 1], // front:  A | B
            [1, 2], // right:  B | C
            [2, 3], // back:   C | D
            [3, 0], // left:   D | A
        ];

        const FACE_NAMES = ['A · B', 'B · C', 'C · D', 'D · A'];
        const FACE_CSS = ['face-front', 'face-right', 'face-back', 'face-left'];
        const FACE_NORMALS = [[0,0,1],[1,0,0],[0,0,-1],[-1,0,0]];

        const cubeEl = document.getElementById('cube');
        const labelEl = document.getElementById('faceLabel');
        const sceneEl = document.getElementById('scene');
        const glowEl = document.getElementById('glow');
        const dots = document.querySelectorAll('.face-dot');

        // Store references to each face's left and right icon elements
        const faceEls = [];
        const faceIconEls = []; // [{left: el, right: el}, ...]

        // Build faces
        FACE_ICONS.forEach(([L, R], i) => {
            const face = document.createElement('div');
            face.className = 'face ' + FACE_CSS[i];

            const leftIcon = document.createElement('div');
            leftIcon.className = 'icon pos-left';
            leftIcon.innerHTML = ICONS_SVG[L];
            leftIcon.dataset.iconIdx = L;

            const rightIcon = document.createElement('div');
            rightIcon.className = 'icon pos-right';
            rightIcon.innerHTML = ICONS_SVG[R];
            rightIcon.dataset.iconIdx = R;

            const sep = document.createElement('div');
            sep.className = 'sep';

            face.appendChild(sep);
            face.appendChild(leftIcon);
            face.appendChild(rightIcon);

            cubeEl.appendChild(face);
            faceEls.push(face);
            faceIconEls.push({ left: leftIcon, right: rightIcon });
        });

        // ═══════════════════════════════════════
        //  Halo dynamique
        // ═══════════════════════════════════════

        function parseMatrix3d(str) {
            const m = str.match(/matrix3d\((.+)\)/);
            if (!m) return null;
            const v = m[1].split(',').map(Number);
            return [[v[0],v[4],v[8]],[v[1],v[5],v[9]],[v[2],v[6],v[10]]];
        }

        function transformNormal(mat, n) {
            return [mat[0][0]*n[0]+mat[0][1]*n[1]+mat[0][2]*n[2],
                    mat[1][0]*n[0]+mat[1][1]*n[1]+mat[1][2]*n[2],
                    mat[2][0]*n[0]+mat[2][1]*n[1]+mat[2][2]*n[2]];
        }

        function updateHalo(mat) {
            faceEls.forEach((el, i) => {
                const wn = transformNormal(mat, FACE_NORMALS[i]);
                const d = Math.max(0, wn[2]);
                el.style.boxShadow =
                    `0 0 ${d*35}px rgba(126,200,227,${d*0.25}),` +
                    `0 0 ${d*15}px rgba(126,200,227,${d*0.15}),` +
                    `inset 0 0 30px rgba(126,200,227,${d*0.1})`;
                el.style.borderColor = `rgba(126,200,227,${0.25+d*0.45})`;

                // Icon glow
                el.querySelectorAll('.icon').forEach(ic => {
                    const g = 4 + d * 8;
                    ic.style.filter = `drop-shadow(0 0 ${g}px rgba(126,200,227,${0.3+d*0.5}))`;
                });
            });
        }

        // ═══════════════════════════════════════
        //  Rotation + icon sliding animation
        // ═══════════════════════════════════════

        let currentFace = 0;
        let currentAngle = 0;
        let transitioning = false;

        function updateUI() {
            labelEl.textContent = FACE_NAMES[currentFace];
            dots.forEach((d, i) => d.classList.toggle('active', i === currentFace));
        }

        function flash() {
            glowEl.classList.remove('flash');
            void glowEl.offsetWidth;
            glowEl.classList.add('flash');
        }

        // Reset all icons to their normal positions (no transition)
        function resetAllIcons() {
            faceIconEls.forEach(({ left, right }) => {
                left.className = 'icon pos-left';
                right.className = 'icon pos-right';
            });
        }

        function goRight() {
            if (transitioning) return;
            transitioning = true;

            const fromFace = currentFace;
            const toFace = (currentFace + 1) % 4;

            // The shared icon: right of current face = left of next face
            // Slide the right icon of current face toward the right edge
            const sharedRight = faceIconEls[fromFace].right;
            sharedRight.className = 'icon slide-to-right';

            // On the arriving face, start the left icon from the left edge (it slides in)
            const sharedLeft = faceIconEls[toFace].left;
            sharedLeft.className = 'icon from-left';

            // Force reflow then animate in
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    sharedLeft.className = 'icon pos-left';
                });
            });

            // Rotate cube
            currentAngle -= 90;
            currentFace = toFace;
            cubeEl.style.transform = `rotateY(${currentAngle}deg)`;
            updateUI();
            flash();

            setTimeout(() => {
                // Reset the icon that slid out
                sharedRight.className = 'icon pos-right';
                transitioning = false;
            }, 750);
        }

        function goLeft() {
            if (transitioning) return;
            transitioning = true;

            const fromFace = currentFace;
            const toFace = (currentFace + 3) % 4;

            // The shared icon: left of current face = right of previous face
            const sharedLeft = faceIconEls[fromFace].left;
            sharedLeft.className = 'icon slide-to-left';

            // On the arriving face, start the right icon from the right edge
            const sharedRight = faceIconEls[toFace].right;
            sharedRight.className = 'icon from-right';

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    sharedRight.className = 'icon pos-right';
                });
            });

            // Rotate cube
            currentAngle += 90;
            currentFace = toFace;
            cubeEl.style.transform = `rotateY(${currentAngle}deg)`;
            updateUI();
            flash();

            setTimeout(() => {
                sharedLeft.className = 'icon pos-left';
                transitioning = false;
            }, 750);
        }

        // ── Swipe ──
        let pointerStart = null, pointerMoved = false;
        sceneEl.addEventListener('pointerdown', e => {
            pointerStart = { x: e.clientX }; pointerMoved = false;
            sceneEl.setPointerCapture(e.pointerId);
        });
        sceneEl.addEventListener('pointermove', e => {
            if (pointerStart && Math.abs(e.clientX - pointerStart.x) > 10) pointerMoved = true;
        });
        sceneEl.addEventListener('pointerup', e => {
            if (!pointerStart) return;
            const dx = e.clientX - pointerStart.x;
            if (pointerMoved && Math.abs(dx) > 20) {
                if (dx > 0) goLeft(); else goRight();
            }
            pointerStart = null;
        });
        sceneEl.addEventListener('pointercancel', () => { pointerStart = null; });

        // ── Wheel ──
        let accX = 0, cooldown = false, resetTimer = null;
        sceneEl.addEventListener('wheel', e => {
            e.preventDefault();
            if (cooldown) return;
            accX += e.deltaX || e.deltaY;
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => { accX = 0; }, 150);
            if (Math.abs(accX) > 30) {
                if (accX > 0) goRight(); else goLeft();
                accX = 0; cooldown = true;
                setTimeout(() => { cooldown = false; }, 400);
            }
        }, { passive: false });

        // ── Keyboard ──
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') goRight();
            if (e.key === 'ArrowLeft') goLeft();
        });

        // ── Buttons ──
        document.getElementById('btnLeft').addEventListener('click', goLeft);
        document.getElementById('btnRight').addEventListener('click', goRight);

        // ── Halo loop ──
        const I = [[1,0,0],[0,1,0],[0,0,1]];
        function animateHalo() {
            const c = getComputedStyle(cubeEl).transform;
            updateHalo((c && c !== 'none') ? parseMatrix3d(c) || I : I);
            requestAnimationFrame(animateHalo);
        }
        requestAnimationFrame(animateHalo);
    </script>
</body>
</html>
