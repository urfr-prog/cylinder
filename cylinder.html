<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fusion Square - Wireframe v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background: linear-gradient(180deg, #0d0d15 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .scene {
            width: 300px;
            height: 450px;
            perspective: 800px;
            perspective-origin: 50% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cylinder {
            width: 0;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: center center;
        }

        .crown {
            position: absolute;
            width: 0;
            left: 0;
            height: 82px;
            transform-style: preserve-3d;
            transition: transform 0.25s ease-out;
        }

        .crown.dragging {
            transition: none;
        }

        .crown.auto-rotating {
            transition: none;
        }

        .cell {
            position: absolute;
            width: 70px;
            height: 82px;
            left: -35px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: none;
            backface-visibility: visible;
            cursor: pointer;
        }

        /* État pendant le long press - glow progressif avec indicateur */
        .cell.pressing {
            animation: pressGlow 0.4s ease-out forwards;
        }

        @keyframes pressGlow {
            0% { 
                box-shadow: 0 0 0 0 rgba(255,255,255,0);
                border-color: rgba(255,255,255,0.12);
            }
            100% { 
                box-shadow: 0 0 20px 5px rgba(255,255,255,0.3);
                border-color: rgba(255,255,255,0.4);
            }
        }

        /* Animation de swap - uniquement pour cellules vivantes */
        .cell.swap-out {
            animation: swapOut 0.4s ease-in-out forwards;
        }

        .cell.swap-in {
            animation: swapIn 0.4s ease-in-out forwards;
        }

        @keyframes swapOut {
            0% { 
                transform: rotateY(var(--base-angle)) translateZ(140px) scale(1);
                opacity: 1;
            }
            50% { 
                transform: rotateY(var(--base-angle)) translateZ(70px) scale(0.3);
                opacity: 0.3;
            }
            100% { 
                transform: rotateY(var(--base-angle)) translateZ(140px) scale(1);
                opacity: 1;
            }
        }

        @keyframes swapIn {
            0% { 
                transform: rotateY(var(--base-angle)) translateZ(140px) scale(1);
                opacity: 0.2;
            }
            50% { 
                transform: rotateY(var(--base-angle)) translateZ(210px) scale(0.3);
                opacity: 0.4;
            }
            100% { 
                transform: rotateY(var(--base-angle)) translateZ(140px) scale(1);
                opacity: 1;
            }
        }

        /* Couleurs désactivées - wireframe mode */
        .color-0, .color-1, .color-2, .color-3, .color-4 { 
            background: transparent; 
            color: rgba(255,255,255,0.95);
        }

        /* SVG icons inside cells */
        .cell svg {
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell svg .separator {
            stroke: rgba(180, 180, 190, 0.35);
            stroke-width: 1;
        }

        .cell svg line.icon, .cell svg path.icon, .cell svg circle.icon, .cell svg rect.icon, .cell svg polyline.icon {
            stroke: rgba(220, 220, 230, 0.8);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .cell svg circle.point {
            fill: rgba(220, 220, 230, 0.8);
            stroke: none;
        }

        .cell.destroying {
            animation: destroy 0.5s ease-out forwards;
        }
        
        @keyframes destroy {
            0% { transform: rotateY(var(--base-angle)) translateZ(140px) scale(1); opacity: 1; }
            50% { transform: rotateY(var(--base-angle)) translateZ(140px) scale(1.2); opacity: 0.8; }
            100% { transform: rotateY(var(--base-angle)) translateZ(140px) scale(0); opacity: 0; }
        }
        
        .cell.destroyed {
            opacity: 0 !important;
            pointer-events: none;
        }

        .swipe-zone {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .swipe-zone:active {
            cursor: grabbing;
        }

        .hint {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* Debug Panel */
        .debug-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            min-width: 400px;
            display: none;
            border: 1px solid #0f0;
        }

        .debug-panel.visible {
            display: block;
        }

        .debug-panel h4 {
            margin: 0 0 12px 0;
            color: #0f0;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .debug-row {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }

        .debug-label {
            color: #888;
        }

        .debug-value {
            color: #0f0;
            font-weight: bold;
        }

        .debug-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1001;
        }

        .debug-toggle:hover {
            background: rgba(255,255,255,0.3);
        }

        .debug-action {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .debug-action button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 5px;
        }

        .debug-action button:hover {
            background: #444;
        }
        
        .debug-section {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }
        
        .debug-section-title {
            color: #ff0;
            font-size: 12px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <button class="debug-toggle" onclick="toggleDebug()">DEBUG</button>
    
    <div class="debug-panel" id="debugPanel">
        <h4>🎮 Fusion Square Wireframe v1</h4>
        
        <div class="debug-row">
            <span class="debug-label">globalRotation:</span>
            <span class="debug-value" id="dbgGlobal">18°</span>
        </div>
        <div class="debug-row">
            <span class="debug-label">crownRotations:</span>
            <span class="debug-value" id="dbgCrownRot">[0,0,0,0,0]</span>
        </div>
        
        <div class="debug-section">
            <div class="debug-section-title">🎯 RAYCASTING 3D</div>
            <div class="debug-row">
                <span class="debug-label">touchX offset:</span>
                <span class="debug-value" id="dbgTouchX">-</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">touchRow:</span>
                <span class="debug-value" id="dbgTouchRow">-</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">raycast angle:</span>
                <span class="debug-value" id="dbgRayAngle">-</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">detected face:</span>
                <span class="debug-value" id="dbgDetectedFace">-</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">face score:</span>
                <span class="debug-value" id="dbgFaceScore">-</span>
            </div>
        </div>
        
        <div class="debug-section">
            <div class="debug-section-title">📊 ÉTAT</div>
            <div class="debug-row">
                <span class="debug-label">gesture:</span>
                <span class="debug-value" id="dbgGesture">idle</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">autoRotation:</span>
                <span class="debug-value" id="dbgAutoRot">active</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">cellules vivantes:</span>
                <span class="debug-value" id="dbgAlive">50/50</span>
            </div>
        </div>

        <div class="debug-action">
            <button onclick="resetGame()">Reset plateau</button>
        </div>
    </div>

    <div class="container">
        <div class="scene" id="scene">
            <div class="cylinder" id="cylinder"></div>
        </div>
        <div class="swipe-zone" id="swipeZone">
            <div class="hint"><span>← SWIPE →</span></div>
        </div>
    </div>

    <script>
        // =====================================================
        // CONSTANTES
        // =====================================================
        const FACES = 10;
        const ROWS = 5;
        const COLORS = 5;
        const RADIUS = 140;
        const ANGLE_STEP = 360 / FACES; // 36°
        const PERSPECTIVE = 800; // Doit matcher le CSS
        
        const INITIAL_ROTATION = 18;

        // =====================================================
        // PARAMÈTRES LONG PRESS - KAIZEN #2: Seuils augmentés
        // =====================================================
        const LONG_PRESS = {
            duration: 400,      // 0.4s (était 0.3s) - plus de temps pour être sûr
            moveThreshold: 20   // pixels (était 10) - plus tolérant au micro-mouvement
        };

        // =====================================================
        // PARAMÈTRES ROTATION AUTOMATIQUE
        // =====================================================
        const AUTO_ROTATION = {
            targetSpeed: -3,
            resumeDelay: 200,
            rampUpDuration: 300,
            isActive: false,
            currentSpeed: 0,
            resumeTimeout: null,
            rampStartTime: null
        };

        // =====================================================
        // PARAMÈTRES D'INTERACTION - KAIZEN #2: Séparation gestes
        // =====================================================
        const INTERACTION = {
            rotationSensitivity: 0.35,
            maxDeltaDegrees: 12,
            maxDeltaPixels: 80,
            directionThreshold: 18  // pixels (était 8) - zone morte plus large
        };

        // =====================================================
        // PARAMÈTRES RAYCASTING 3D - KAIZEN #1
        // =====================================================
        const RAYCAST = {
            // Angle max visible depuis le centre (en degrés)
            // Avec perspective 800 et radius 140, environ ±70°
            maxVisibleAngle: 75,
            // Tolérance pour les bords (faces -2 et +2)
            edgeTolerance: 1.3  // Multiplicateur de zone de hit
        };

        // =====================================================
        // PLATEAU FIXE
        // =====================================================
        const FIXED_GRID = [
            [2, 0, 3, 1, 4],
            [1, 3, 0, 4, 2],
            [4, 2, 1, 0, 3],
            [0, 4, 2, 3, 1],
            [3, 1, 4, 2, 0],
            [2, 3, 0, 1, 4],
            [4, 0, 3, 2, 1],
            [1, 4, 2, 0, 3],
            [3, 2, 1, 4, 0],
            [0, 1, 4, 3, 2]
        ];

        // =====================================================
        // ÉTAT DU JEU
        // =====================================================
        let globalRotation = INITIAL_ROTATION;
        let crownRotations = [0, 0, 0, 0, 0];
        let gridByFace = [];
        let cellState = [];
        let isDestroying = false;
        let lastFrameTime = 0;

        // État Long Press
        let longPressTimeout = null;
        let longPressStartX = 0;
        let longPressStartY = 0;
        let longPressDetectedFace = null;
        let longPressRow = null;
        let isLongPressing = false;
        let isSwapping = false;
        
        // État Gesture - KAIZEN #3: États clairs
        let currentGesture = 'idle'; // 'idle', 'pending', 'longpress', 'drag'

        // Debug raycasting
        let dbgTouchXOffset = 0;
        let dbgRayAngle = 0;
        let dbgFaceScore = 0;

        function initGrid() {
            gridByFace = [];
            cellState = [];
            for (let f = 0; f < FACES; f++) {
                gridByFace[f] = [...FIXED_GRID[f]];
                cellState[f] = [true, true, true, true, true];
            }
            isDestroying = false;
        }

        // =====================================================
        // RAYCASTING 3D - KAIZEN #1: Détection précise
        // =====================================================
        
        /**
         * Convertit une position X écran en angle de vue
         * Prend en compte la perspective pour un calcul précis
         */
        function screenXToViewAngle(x) {
            const scene = document.getElementById('scene');
            const rect = scene.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const offsetX = x - centerX;
            
            dbgTouchXOffset = offsetX;
            
            // Calcul de l'angle basé sur la perspective
            // tan(angle) = offsetX / perspective
            const angleRad = Math.atan2(offsetX, PERSPECTIVE);
            const angleDeg = angleRad * (180 / Math.PI);
            
            dbgRayAngle = angleDeg;
            
            return angleDeg;
        }
        
        /**
         * Trouve la face sous le point de toucher pour une row donnée
         * Utilise le raycasting avec prise en compte de la rotation
         */
        function getFaceFromScreenPosition(x, row) {
            const viewAngle = screenXToViewAngle(x);
            
            // Rotation totale pour cette row
            const totalRotation = globalRotation + crownRotations[row];
            
            // Angle cible dans le référentiel du cylindre
            // L'angle de vue correspond à une face quand:
            // faceAngle + totalRotation ≈ viewAngle (modulo les faces arrière)
            const targetCylinderAngle = -viewAngle; // Inversé car rotation positive = sens horaire
            
            // Chercher la face la plus proche
            let bestFace = 0;
            let bestScore = Infinity;
            
            for (let f = 0; f < FACES; f++) {
                const faceBaseAngle = f * ANGLE_STEP; // 0, 36, 72, ...
                const faceWorldAngle = faceBaseAngle + totalRotation;
                
                // Normaliser entre -180 et 180
                let diff = ((faceWorldAngle - targetCylinderAngle + 180) % 360) - 180;
                if (diff < -180) diff += 360;
                
                // Vérifier si la face est visible (pas à l'arrière)
                let faceVisibleAngle = ((faceWorldAngle % 360) + 360) % 360;
                if (faceVisibleAngle > 180) faceVisibleAngle -= 360;
                
                // Face visible si son angle est dans [-maxVisibleAngle, +maxVisibleAngle]
                const isVisible = Math.abs(faceVisibleAngle) < RAYCAST.maxVisibleAngle;
                
                if (!isVisible) continue;
                
                const score = Math.abs(diff);
                
                // Appliquer tolérance pour les bords
                // Les faces aux extrémités (-2, +2 visuellement) ont une zone plus large
                const visualPosition = Math.abs(faceVisibleAngle) / ANGLE_STEP;
                const isEdge = visualPosition > 1.5;
                const adjustedScore = isEdge ? score / RAYCAST.edgeTolerance : score;
                
                if (adjustedScore < bestScore) {
                    bestScore = adjustedScore;
                    bestFace = f;
                }
            }
            
            dbgFaceScore = bestScore.toFixed(1);
            
            // Vérifier que le score est acceptable (pas trop loin d'une face)
            if (bestScore > ANGLE_STEP / 2 * 1.5) {
                return null; // Touch trop loin de toute face
            }
            
            return bestFace;
        }
        
        function getRowFromY(y) {
            const scene = document.getElementById('scene');
            const rect = scene.getBoundingClientRect();
            const relativeY = y - rect.top;
            
            const sceneHeight = 450;
            const zoneHeight = sceneHeight / ROWS;
            
            if (relativeY < 0) return 0;
            if (relativeY >= sceneHeight) return ROWS - 1;
            
            return Math.min(Math.floor(relativeY / zoneHeight), ROWS - 1);
        }

        function getBackFace(face) {
            return (face + 5) % FACES;
        }
        
        /**
         * Obtient la face centrale visible pour une row
         */
        function getCenterFaceForRow(row) {
            const totalRotation = globalRotation + crownRotations[row];
            const normalized = (((-totalRotation) % 360) + 360) % 360;
            return Math.round(normalized / ANGLE_STEP) % FACES;
        }

        // =====================================================
        // PROTECTION ANTI-EMBALLEMENT
        // =====================================================
        function sanitizeDelta(deltaPixels) {
            if (Math.abs(deltaPixels) > INTERACTION.maxDeltaPixels) {
                return 0;
            }
            
            let deltaDegrees = deltaPixels * INTERACTION.rotationSensitivity;
            deltaDegrees = Math.max(-INTERACTION.maxDeltaDegrees, Math.min(INTERACTION.maxDeltaDegrees, deltaDegrees));
            
            return deltaDegrees;
        }

        // =====================================================
        // LONG PRESS & SWAP - KAIZEN #3: Gestion état machine
        // =====================================================
        
        function startLongPress(x, y) {
            if (isSwapping || isDestroying) return;
            
            const row = getRowFromY(y);
            const detectedFace = getFaceFromScreenPosition(x, row);
            
            // Si on n'a pas trouvé de face valide, annuler
            if (detectedFace === null) {
                currentGesture = 'idle';
                updateDebug();
                return;
            }
            
            longPressStartX = x;
            longPressStartY = y;
            longPressDetectedFace = detectedFace;
            longPressRow = row;
            isLongPressing = true;
            currentGesture = 'pending';
            
            const cell = document.querySelector(`.cell[data-face="${detectedFace}"][data-row="${row}"]`);
            
            // Ajouter effet pressing seulement si cellule vivante
            if (cell && cellState[detectedFace][row]) {
                const angle = detectedFace * ANGLE_STEP;
                cell.style.setProperty('--base-angle', angle + 'deg');
                cell.classList.add('pressing');
            }
            
            longPressTimeout = setTimeout(() => {
                if (isLongPressing && currentGesture === 'pending') {
                    currentGesture = 'longpress';
                    triggerSwap(longPressDetectedFace, longPressRow);
                }
            }, LONG_PRESS.duration);
            
            updateDebug();
        }
        
        function cancelLongPress() {
            if (longPressTimeout) {
                clearTimeout(longPressTimeout);
                longPressTimeout = null;
            }
            
            document.querySelectorAll('.cell.pressing').forEach(cell => {
                cell.classList.remove('pressing');
            });
            
            longPressDetectedFace = null;
            longPressRow = null;
            isLongPressing = false;
            
            if (currentGesture !== 'drag') {
                currentGesture = 'idle';
            }
            
            updateDebug();
        }
        
        function checkLongPressMove(x, y) {
            if (!isLongPressing || currentGesture !== 'pending') return false;
            
            const dx = x - longPressStartX;
            const dy = y - longPressStartY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > LONG_PRESS.moveThreshold) {
                cancelLongPress();
                return true; // Mouvement détecté
            }
            return false;
        }
        
        function triggerSwap(frontFace, row) {
            if (isSwapping || frontFace === null) return;
            
            const backFace = getBackFace(frontFace);
            
            const frontAlive = cellState[frontFace][row];
            const backAlive = cellState[backFace][row];
            
            // Si les deux sont mortes, rien à faire
            if (!frontAlive && !backAlive) {
                cancelLongPress();
                return;
            }
            
            isSwapping = true;
            
            const frontCell = document.querySelector(`.cell[data-face="${frontFace}"][data-row="${row}"]`);
            const backCell = document.querySelector(`.cell[data-face="${backFace}"][data-row="${row}"]`);
            
            if (!frontCell || !backCell) {
                isSwapping = false;
                cancelLongPress();
                return;
            }
            
            frontCell.classList.remove('pressing');
            
            const frontAngle = frontFace * ANGLE_STEP;
            const backAngle = backFace * ANGLE_STEP;
            
            frontCell.style.setProperty('--base-angle', frontAngle + 'deg');
            backCell.style.setProperty('--base-angle', backAngle + 'deg');
            
            // Animation seulement pour les cellules vivantes
            if (frontAlive) {
                frontCell.classList.add('swap-out');
            }
            if (backAlive) {
                backCell.classList.add('swap-in');
            }
            
            // Swap des données à mi-animation
            setTimeout(() => {
                // Swap couleurs
                const tempColor = gridByFace[frontFace][row];
                gridByFace[frontFace][row] = gridByFace[backFace][row];
                gridByFace[backFace][row] = tempColor;
                
                // Swap état (alive/dead)
                const tempState = cellState[frontFace][row];
                cellState[frontFace][row] = cellState[backFace][row];
                cellState[backFace][row] = tempState;
                
                // Mettre à jour les couleurs
                updateCellAppearance(frontCell, frontFace, row);
                updateCellAppearance(backCell, backFace, row);
            }, 200);
            
            // Fin animation
            setTimeout(() => {
                frontCell.classList.remove('swap-out');
                backCell.classList.remove('swap-in');
                
                // Restaurer le transform
                frontCell.style.transform = `rotateY(${frontAngle}deg) translateZ(${RADIUS}px)`;
                backCell.style.transform = `rotateY(${backAngle}deg) translateZ(${RADIUS}px)`;
                
                // S'assurer que les cellules mortes sont bien invisibles
                if (!cellState[frontFace][row]) {
                    frontCell.classList.add('destroyed');
                    frontCell.style.opacity = '0';
                }
                if (!cellState[backFace][row]) {
                    backCell.classList.add('destroyed');
                    backCell.style.opacity = '0';
                }
                
                isSwapping = false;
                cancelLongPress();
                
                checkVerticalLines();
            }, 400);
        }
        
        function updateCellAppearance(cell, face, row) {
            const color = gridByFace[face][row];
            const alive = cellState[face][row];
            
            // Retirer anciennes classes couleur
            cell.className = cell.className.replace(/color-\d/g, '').trim();
            cell.classList.add(`color-${color}`);
            
            if (alive) {
                cell.classList.remove('destroyed');
                cell.style.opacity = '1';
            } else {
                cell.classList.add('destroyed');
                cell.style.opacity = '0';
            }
        }

        // =====================================================
        // ROTATION AUTOMATIQUE
        // =====================================================
        function stopAutoRotation() {
            AUTO_ROTATION.isActive = false;
            AUTO_ROTATION.currentSpeed = 0;
            AUTO_ROTATION.rampStartTime = null;
            
            if (AUTO_ROTATION.resumeTimeout) {
                clearTimeout(AUTO_ROTATION.resumeTimeout);
                AUTO_ROTATION.resumeTimeout = null;
            }
            
            document.querySelectorAll('.crown').forEach(crown => {
                crown.classList.remove('auto-rotating');
            });
        }
        
        function scheduleAutoRotationResume() {
            if (AUTO_ROTATION.resumeTimeout) {
                clearTimeout(AUTO_ROTATION.resumeTimeout);
            }
            
            AUTO_ROTATION.resumeTimeout = setTimeout(() => {
                startAutoRotation();
            }, AUTO_ROTATION.resumeDelay);
        }
        
        function startAutoRotation() {
            AUTO_ROTATION.isActive = true;
            AUTO_ROTATION.currentSpeed = 0;
            AUTO_ROTATION.rampStartTime = performance.now();
            
            document.querySelectorAll('.crown').forEach(crown => {
                crown.classList.add('auto-rotating');
            });
        }
        
        function updateAutoRotation(timestamp) {
            if (!AUTO_ROTATION.isActive) return;
            
            if (AUTO_ROTATION.rampStartTime !== null) {
                const elapsed = timestamp - AUTO_ROTATION.rampStartTime;
                const progress = Math.min(elapsed / AUTO_ROTATION.rampUpDuration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                AUTO_ROTATION.currentSpeed = AUTO_ROTATION.targetSpeed * eased;
                
                if (progress >= 1) {
                    AUTO_ROTATION.rampStartTime = null;
                }
            }
            
            const deltaTime = (timestamp - lastFrameTime) / 1000;
            const deltaRotation = AUTO_ROTATION.currentSpeed * deltaTime;
            
            globalRotation += deltaRotation;
            updateAllRotationsImmediate();
        }

        // BOUCLE D'ANIMATION
        // =====================================================

            return snapped;

            let allSameColor = true;

            // Pour cette face, récupérer la couleur de chaque row
            // en tenant compte des rotations individuelles
            const colors = [];
            const actualFaces = [];
            
            for (let r = 0; r < ROWS; r++) {
                // Calculer quelle face est alignée visuellement avec 'face' pour cette row
                const rowRotationOffset = Math.round(crownRotations[r] / ANGLE_STEP);
                const actualFace = ((face - rowRotationOffset) % FACES + FACES) % FACES;
                actualFaces.push(actualFace);
                
                if (!cellState[actualFace][r]) {
                    allAlive = false;
                    break;
                }
                
                const color = gridByFace[actualFace][r];
                colors.push(color);
                
                if (firstColor === null) {
                    firstColor = color;
                } else if (color !== firstColor) {
                    allSameColor = false;
                    break;
                }
            }
            
            if (allAlive && allSameColor && firstColor !== null) {
                destroyColumn(actualFaces);
                return true;
            }
            return false;

        function handleCellClick(face, row) {
            if (isSwapping || isDestroying) return;
            const cell = document.querySelector(`.cell[data-face="${face}"][data-row="${row}"]`);
            if (!cell) return;
            const svg = cell.querySelector('svg');
            if (!svg) return;
            
            iconRotations[face][row] += 90;
            const rot = iconRotations[face][row];
            
            svg.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            svg.style.transform = `rotate(${rot - 45}deg) scale(0.85)`;
            
            setTimeout(() => {
                svg.style.transform = `rotate(${rot}deg) scale(1)`;
            }, 200);
        }

        // =====================================================
        // CONSTRUCTION CYLINDRE
        // =====================================================
        function buildCylinder() {
            const cylinder = document.getElementById('cylinder');
            cylinder.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                const crown = document.createElement('div');
                crown.className = 'crown';
                crown.dataset.row = r;
                crown.style.top = crownTops[r] + 'px';

                for (let f = 0; f < FACES; f++) {
                    const cell = document.createElement('div');
                    const color = gridByFace[f][r];
                    cell.className = `cell color-${color}`;
                    cell.dataset.face = f;
                    cell.dataset.row = r;
                    
                    if (!cellState[f][r]) {
                        cell.classList.add('destroyed');
                        cell.style.opacity = '0';
                    }
                    
                    const angle = f * ANGLE_STEP;
                    cell.style.transform = `rotateY(${angle}deg) translateZ(${RADIUS}px)`;
                    cell.style.setProperty('--base-angle', angle + 'deg');
                    
                    // Injecter l'icône SVG
                    if (ICON_SVG[f] && ICON_SVG[f][r]) {
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('viewBox', '0 0 80 80');
                        svg.innerHTML = ICON_SVG[f][r];
                        cell.textContent = '';
                        cell.appendChild(svg);
                    }
                    
                    crown.appendChild(cell);
                }

                cylinder.appendChild(crown);
            }
            updateAllRotations();
            updateDebug();
        }

        // =====================================================
        // MISE À JOUR VISUELLE - KAIZEN #6: Fonction unique
        // =====================================================
        function updateAllRotations(updateDbg = true) {
            const crowns = document.querySelectorAll('.crown');
            crowns.forEach((crown, index) => {
                const totalRotation = globalRotation + crownRotations[index];
                crown.style.transform = `rotateY(${totalRotation}deg)`;
            });
            if (updateDbg) updateDebug();
        }
        
        function updateAllRotationsImmediate() {
            updateAllRotations(false);
        }

        function setDragging(crownIndex, isDragging) {
            const crowns = document.querySelectorAll('.crown');
            if (crownIndex === -1) {
                crowns.forEach(crown => {
                    if (isDragging) crown.classList.add('dragging');
                    else crown.classList.remove('dragging');
                });
            } else if (crowns[crownIndex]) {
                if (isDragging) crowns[crownIndex].classList.add('dragging');
                else crowns[crownIndex].classList.remove('dragging');
            }
        }

        // =====================================================
        // ÉVÉNEMENTS
        // =====================================================
        function onInteractionStart() {
            stopAutoRotation();
        }
        
        function onInteractionEnd() {
            scheduleAutoRotationResume();
        }

        const swipeZone = document.getElementById('swipeZone');
        const scene = document.getElementById('scene');

        // =====================================================
        // SWIPE ZONE
        // =====================================================
        swipeZone.addEventListener('touchstart', (e) => {
            onInteractionStart();
            isDraggingGlobal = true;
            lastX = e.touches[0].clientX;
            setDragging(-1, true);
            currentGesture = 'drag';
            updateDebug();
        }, { passive: true });

        swipeZone.addEventListener('touchmove', (e) => {
            if (!isDraggingGlobal) return;
            
            const currentX = e.touches[0].clientX;
            const deltaPixels = currentX - lastX;
            const deltaDegrees = sanitizeDelta(deltaPixels);
            
            if (deltaDegrees !== 0) {
                globalRotation += deltaDegrees;
                updateAllRotations();
            }
            
            lastX = currentX;
        }, { passive: true });

        swipeZone.addEventListener('touchend', () => {
            if (isDraggingGlobal) {
                isDraggingGlobal = false;
                setDragging(-1, false);
                snapGlobal();
                currentGesture = 'idle';
                onInteractionEnd();
                updateDebug();
            }
        });

        swipeZone.addEventListener('mousedown', (e) => {
            onInteractionStart();
            isDraggingGlobal = true;
            lastX = e.clientX;
            setDragging(-1, true);
            currentGesture = 'drag';
            updateDebug();
        });

        // =====================================================
        // SCENE - Touch
        // =====================================================
        scene.addEventListener('touchstart', (e) => {
            onInteractionStart();
            const touch = e.touches[0];
            
            activeCrown = getRowFromY(touch.clientY);
            
            lastX = touch.clientX;
            lastY = touch.clientY;
            dragStartX = lastX;
            dragStartY = lastY;
            
            startLongPress(touch.clientX, touch.clientY);
        }, { passive: true });

        scene.addEventListener('touchmove', (e) => {
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            // Vérifier si le mouvement annule le long press
            const movedBeyondThreshold = checkLongPressMove(currentX, currentY);
            
            const deltaX = currentX - dragStartX;
            const deltaY = currentY - dragStartY;
            
            // Détection du drag seulement si on dépasse le seuil ET qu'on était en pending
            if (currentGesture === 'idle' && Math.abs(deltaX) > INTERACTION.directionThreshold) {
                currentGesture = 'drag';
                isDraggingCrown = true;
                if (activeCrown >= 0) setDragging(activeCrown, true);
                updateDebug();
            }
            
            if (currentGesture === 'drag' && activeCrown >= 0) {
                const deltaPixels = currentX - lastX;
                const deltaDegrees = sanitizeDelta(deltaPixels);
                
                if (deltaDegrees !== 0) {
                    crownRotations[activeCrown] += deltaDegrees;
                    updateAllRotations();
                }
            }
            
            lastX = currentX;
            lastY = currentY;
        }, { passive: true });

        scene.addEventListener('touchend', () => {
            // Détection tap simple (pas de drag, pas de long press déclenché)
            if (currentGesture === 'pending' && !isDraggingCrown && longPressDetectedFace !== null && longPressRow !== null) {
                handleCellClick(longPressDetectedFace, longPressRow);
            }
            
            cancelLongPress();
            
            if (isDraggingCrown && activeCrown >= 0) {
                setDragging(activeCrown, false);
                snapCrown(activeCrown);
            }
            
            isDraggingCrown = false;
            activeCrown = -1;
            currentGesture = 'idle';
            updateDebug();
            onInteractionEnd();
        });

        // =====================================================
        // SCENE - Mouse
        // =====================================================
        scene.addEventListener('mousedown', (e) => {
            onInteractionStart();
            
            activeCrown = getRowFromY(e.clientY);
            
            lastX = e.clientX;
            lastY = e.clientY;
            dragStartX = lastX;
            dragStartY = lastY;
            
            startLongPress(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            checkLongPressMove(e.clientX, e.clientY);
            
            if (isDraggingGlobal) {
                const currentX = e.clientX;
                const deltaPixels = currentX - lastX;
                const deltaDegrees = sanitizeDelta(deltaPixels);
                
                if (deltaDegrees !== 0) {
                    globalRotation += deltaDegrees;
                    updateAllRotations();
                }
                
                lastX = currentX;
                return;
            }
            
            if (activeCrown < 0) return;
            
            const currentX = e.clientX;
            const currentY = e.clientY;
            const deltaX = currentX - dragStartX;
            
            if (currentGesture === 'idle' && Math.abs(deltaX) > INTERACTION.directionThreshold) {
                currentGesture = 'drag';
                isDraggingCrown = true;
                if (activeCrown >= 0) setDragging(activeCrown, true);
                updateDebug();
            }
            
            if (currentGesture === 'drag' && activeCrown >= 0) {
                const deltaPixels = currentX - lastX;
                const deltaDegrees = sanitizeDelta(deltaPixels);
                
                if (deltaDegrees !== 0) {
                    crownRotations[activeCrown] += deltaDegrees;
                    updateAllRotations();
                }
            }
            
            lastX = currentX;
            lastY = currentY;
        });

        document.addEventListener('mouseup', () => {
            // Détection clic simple (pas de drag, pas de long press déclenché)
            if (currentGesture === 'pending' && !isDraggingCrown && !isDraggingGlobal && longPressDetectedFace !== null && longPressRow !== null) {
                handleCellClick(longPressDetectedFace, longPressRow);
            }
            
            cancelLongPress();
            
            if (isDraggingGlobal) {
                isDraggingGlobal = false;
                setDragging(-1, false);
                snapGlobal();
                currentGesture = 'idle';
                onInteractionEnd();
            }
            if (isDraggingCrown && activeCrown >= 0) {
                setDragging(activeCrown, false);
                snapCrown(activeCrown);
                onInteractionEnd();
            }
            
            if (activeCrown >= 0) {
                onInteractionEnd();
            }
            
            isDraggingCrown = false;
            activeCrown = -1;
            currentGesture = 'idle';
            updateDebug();
        });

        // =====================================================
        // MOLETTE
        // =====================================================
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            onInteractionStart();
            
            let deltaPixels = e.deltaX !== 0 ? e.deltaX : e.deltaY;
            let deltaDegrees = sanitizeDelta(deltaPixels * 0.5);
            
            if (deltaDegrees !== 0) {
                globalRotation += deltaDegrees;
                updateAllRotations();
            }
            
            clearTimeout(window.wheelTimeout);
            window.wheelTimeout = setTimeout(() => {
                snapGlobal();
                onInteractionEnd();
            }, 150);
        }, { passive: false });

        // =====================================================
        // INIT
        // =====================================================
        initGrid();
        buildCylinder();
        
        requestAnimationFrame(animationLoop);
        startAutoRotation();
        
        setTimeout(checkVerticalLines, 100);
    </script>
</body>
</html>
